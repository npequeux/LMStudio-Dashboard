[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dashboard-lmstudio-metrics-server"
version = "0.1.0"
description = "LAN metrics bridge and optional inference proxy for the DashboardLMStudio Android app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/metrics_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
