name: Build and Publish Android App

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  APP_NAME: DashboardLMStudio

jobs:
  build:
    name: Build APK (${{ github.event_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platforms
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build debug APK
        run: dotnet build -f net10.0-android -c Release app/DashboardLMStudio.csproj

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/bin/Release/net10.0-android/com.example.dashboardlmstudio-Signed.apk
          retention-days: 30

  python-tests:
    name: Python bridge tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install bridge dependencies
        run: uv sync --extra test
        working-directory: companion-metrics-server

      - name: Run bridge tests
        run: uv run pytest -q
        working-directory: companion-metrics-server

  dotnet-tests:
    name: .NET bridge client tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run app client tests
        run: dotnet test app-tests/DashboardLMStudio.Tests.csproj

  release:
    name: Release APK (${{ github.event_name }})
    needs: [build, python-tests, dotnet-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only version tags publish. Publishing on both main pushes and tags produced
    # duplicate releases, and the run-number one could be marked Latest.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: release-assets

      - name: Package companion metrics server
        run: python3 .github/scripts/package_companion.py --output release-assets/DashboardLMStudio_MetricsServer.zip

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && format('v{0}', github.run_number) || github.ref_name }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          RELEASE_NAME="LM Studio Monitor $TAG_NAME"
          printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "## LM Studio Monitor $TAG_NAME" \
            "- .NET MAUI Android dashboard with a Star Trek LCARS theme: CPU, memory, GPU, token speed, prompt/completion and error metrics." \
            "- Ships the FastAPI metrics bridge, which also serves the same dashboard at GET /." \
            "- The APK is debug-signed (no release keystore), so it is not suitable for Play Store distribution." \
            "- Triggered by: ${{ github.event_name }}" \
            "- Build time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "" \
            "[Download APK](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/com.example.dashboardlmstudio-Signed.apk)" \
            "[Download companion metrics server](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DashboardLMStudio_MetricsServer.zip)" > /tmp/release_body.txt
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            # Re-runs must be idempotent: gh release create fails on an existing tag.
            gh release upload "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              release-assets/com.example.dashboardlmstudio-Signed.apk \
              release-assets/DashboardLMStudio_MetricsServer.zip
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes-file /tmp/release_body.txt \
              release-assets/com.example.dashboardlmstudio-Signed.apk \
              release-assets/DashboardLMStudio_MetricsServer.zip
          fi

  notify:
    name: Verify jobs
    needs: [build, python-tests, dotnet-tests, release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Fail if a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Job status
        run: echo "build=${{ needs.build.result }} python=${{ needs.python-tests.result }} dotnet=${{ needs.dotnet-tests.result }} release=${{ needs.release.result }}"
