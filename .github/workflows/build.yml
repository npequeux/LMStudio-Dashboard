name: Build and Publish Android App

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  APP_NAME: DashboardLMStudio

jobs:
  build:
    name: Build APK (${{ github.event_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platforms
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build debug APK
        run: dotnet build -f net10.0-android -c Release app/DashboardLMStudio.csproj

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/bin/Release/net10.0-android/com.example.dashboardlmstudio-Signed.apk
          retention-days: 30

  python-tests:
    name: Python bridge tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install bridge dependencies
        run: uv sync --extra test
        working-directory: companion-metrics-server

      - name: Run bridge tests
        run: uv run pytest -q
        working-directory: companion-metrics-server

  release:
    name: Release APK (${{ github.event_name }})
    needs: [build, python-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: release-assets

      - name: Package companion metrics server
        run: python3 .github/scripts/package_companion.py --output release-assets/DashboardLMStudio_MetricsServer.zip

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && format('v{0}', github.run_number) || github.ref_name }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          RELEASE_NAME="Release $TAG_NAME (debug build)"
          printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "## Debug release" \
            "- This APK is debug-signed and intended for testing, not production or Play Store distribution." \
            "- A later CI run may use a different debug key; uninstall an older debug build if Android refuses the update." \
            "- Triggered by: ${{ github.event_name }}" \
            "- Build time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "" \
            "[Download debug APK](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/com.example.dashboardlmstudio-Signed.apk)" \
            "[Download companion metrics server](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DashboardLMStudio_MetricsServer.zip)" > /tmp/release_body.txt
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes-file /tmp/release_body.txt \
            release-assets/com.example.dashboardlmstudio-Signed.apk \
            release-assets/DashboardLMStudio_MetricsServer.zip

  notify:
    name: Notify on Success/Failure
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build status
        run: |
          echo "Build completed!"
          echo "Release job skipped (not main branch or not push event)"
