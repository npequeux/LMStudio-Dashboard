name: Build and Publish Android App

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  APP_NAME: DashboardLMStudio
  JAVA_VERSION: '17'
  GRADLE_WRAPPER_VERSION: '8.4'

jobs:
  build:
    name: Build APK (${{ github.event_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ env.JAVA_VERSION }}'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  lint-check:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ env.JAVA_VERSION }}'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint check
        run: ./gradlew lint --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results.html

  release:
    name: Release APK (${{ github.event_name }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: release-assets

      - name: Package companion metrics server
        run: python3 .github/scripts/package_companion.py --output release-assets/DashboardLMStudio_MetricsServer.zip

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && format('v{0}', github.run_number) || github.ref_name }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          RELEASE_NAME="Release $TAG_NAME (temporary debug build)"
          printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "## Temporary debug release" \
            "- This APK is debug-signed and intended for testing, not production or Play Store distribution." \
            "- Its application ID has the .debug suffix." \
            "- A later CI run may use a different debug key; uninstall an older debug build if Android refuses the update." \
            "- Triggered by: ${{ github.event_name }}" \
            "- Build time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "" \
            "[Download debug APK](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/app-debug.apk)" \
            "[Download companion metrics server](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DashboardLMStudio_MetricsServer.zip)" > /tmp/release_body.txt
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes-file /tmp/release_body.txt \
            release-assets/app-debug.apk \
            release-assets/DashboardLMStudio_MetricsServer.zip

  notify:
    name: Notify on Success/Failure
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build status
        run: |
          echo "Build completed!"
          echo "Release job skipped (not main branch or not push event)"
